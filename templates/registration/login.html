<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kelola Budget Makan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00c2cb;
            --primary-hover: #00a4ad;
            --bg-gradient: linear-gradient(-45deg, #111e25, #17313a, #0b252e, #1a3c47);
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            position: relative; background: var(--bg-gradient);
            background-size: 400% 400%; animation: gradientMove 12s ease infinite;
            overflow: hidden;
        }
        body::before {
            content: ""; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: radial-gradient(circle, rgba(0,194,203,0.15) 1px, transparent 1px),
                              radial-gradient(circle, rgba(255,255,255,0.05) 2px, transparent 2px);
            background-size: 40px 40px, 80px 80px; animation: particleMove 60s linear infinite; z-index: 1;
        }
        @keyframes gradientMove { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes particleMove { 0%{transform:rotate(0deg) translate(0,0)} 100%{transform:rotate(360deg) translate(-50px,-50px)} }
        .auth-card {
            background: rgba(255,255,255,0.95); border: none; border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); backdrop-filter: blur(12px);
            max-width: 415px; width: 100%; padding: 2.8rem 2.2rem; position: relative; z-index: 10;
            animation: cardEnter 0.7s cubic-bezier(0.25,1,0.5,1) forwards;
        }
        @keyframes cardEnter { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }
        .brand-avatar { width: 72px; height: 72px; background: rgba(0,194,203,0.12); color: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 1.2rem; }
        .form-label { font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: #344767; }
        .form-control { border-radius: 12px; padding: 0.75rem 1rem; border: 1.5px solid #d2d6da; transition: all 0.25s; }
        .form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(0,194,203,0.25); }
        .password-container { position: relative; }
        .password-container .form-control { padding-right: 3rem; }
        .toggle-password-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #a0aec0; cursor: pointer; font-size: 1rem; }
        .toggle-password-btn:hover { color: var(--primary-color); }
        .btn-submit { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); color: #fff; border: none; border-radius: 12px; padding: 0.8rem; font-weight: 600; box-shadow: 0 4px 15px rgba(0,194,203,0.2); transition: all 0.3s; }
        .btn-submit:hover { background: linear-gradient(135deg, var(--primary-hover), #008b93); color: #fff; transform: translateY(-2px); }
        .error-banner { background: #fee2e2; color: #dc2626; border-left: 4px solid #dc2626; border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.83rem; margin-bottom: 1.25rem; display: flex; align-items: center; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center">
            <div class="brand-avatar"><i class="fa-solid fa-lock"></i></div>
            <h3 class="fw-bold mb-1">Login</h3>
            <p class="text-muted small mb-4">Masuk untuk mengelola budget makanmu</p>
        </div>

        {% if form.errors %}
        <div class="error-banner">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <div>Nama pengguna atau sandi salah. Silakan coba lagi.</div>
        </div>
        {% endif %}

        {% for message in messages %}
        <div class="error-banner" style="background:#d1fae5;color:#065f46;border-color:#10b981;">
            <i class="fa-solid fa-circle-check me-2"></i>
            <div>{{ message }}</div>
        </div>
        {% endfor %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
                <label class="form-label">Nama Pengguna</label>
                <input type="text" name="username" class="form-control {% if form.errors %}is-invalid{% endif %}"
                       value="{{ form.username.value|default:'' }}"
                       placeholder="Masukkan nama pengguna" required autocomplete="username" autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Sandi</label>
                <div class="password-container">
                    <input type="password" name="password" id="id_password"
                           class="form-control {% if form.errors %}is-invalid{% endif %}"
                           placeholder="Masukkan sandi" required autocomplete="current-password">
                    <button type="button" class="toggle-password-btn" onclick="togglePass()">
                        <i class="fa-regular fa-eye" id="eye_icon"></i>
                    </button>
                </div>
            </div>
            <div class="text-end mb-4">
                <a href="{% url 'budget:lupa_password' %}" class="small text-decoration-none" style="color:var(--primary-color);font-weight:600;">
                    <i class="fa-solid fa-key me-1"></i>Lupa password?
                </a>
            </div>
            <button type="submit" class="btn btn-submit w-100 mb-4">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk Sekarang
            </button>
            <div class="text-center small text-muted">
                Belum punya akun?
                <a href="{% url 'budget:register' %}" style="color:var(--primary-color);font-weight:600;text-decoration:none;">Daftar di sini</a>
            </div>
        </form>
    </div>
    <script>
        function togglePass() {
            const x = document.getElementById('id_password');
            const ico = document.getElementById('eye_icon');
            if (x.type === 'password') { x.type = 'text'; ico.className = 'fa-solid fa-eye-slash'; }
            else { x.type = 'password'; ico.className = 'fa-regular fa-eye'; }
        }
    </script>
</body>
</html>
